name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts
      - run: uv run pytest

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 10
    env:
      # Each test that uses the `settings` fixture gets its own fresh databases on this server.
      AGENT_ZERO_TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  containers:
    needs: [backend, backend-postgres, frontend]
    runs-on: ubuntu-latest
    env:
      AGENT_ZERO_LLM_MODE: demo
      AGENT_ZERO_LLM_DAILY_CALL_LIMIT: 5000
      AGENT_ZERO_LLM_CAMPAIGN_CALL_LIMIT: 1200
    steps:
      - uses: actions/checkout@v5
      - name: Configure an isolated operator credential
        run: |
          python3 - <<'PY'
          import os
          import secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.write("AGENT_ZERO_OPERATOR_SECRET=" + secrets.token_urlsafe(32) + "\n")
              target.write("POSTGRES_PASSWORD=" + secrets.token_hex(16) + "\n")
          PY
      - run: docker compose -f infra/compose.yaml up --build --detach --wait
      - run: ./infra/scripts/smoke.sh
      - run: ./infra/scripts/smoke.sh --exercise
      - if: failure()
        run: docker compose -f infra/compose.yaml logs
      - if: always()
        run: docker compose -f infra/compose.yaml down --volumes

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [containers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agent-zero-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

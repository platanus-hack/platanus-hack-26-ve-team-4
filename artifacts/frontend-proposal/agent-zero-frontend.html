<script type="application/json" id="zero-audit">{"summary":"La propuesta debe funcionar como un laboratorio de evidencia: conectar cada intento con sus llamadas, efectos, oráculos, hallazgos, controles y validaciones. La captura real disponible registra dos intentos inconclusos por fallo del proveedor; no demuestra una defensa exitosa. Los resultados simulados deben identificarse y las funciones pendientes deben distinguirse de los contratos existentes.","removed":[{"thing":"Hero grande con número de fase","reason":"Ocupa espacio de la tabla y la evidencia sin ayudar a una decisión. La fase cabe en una barra contextual."},{"thing":"Tarjetas explicativas de nueva sesión y sesión existente","reason":"Son documentación estática. La diferencia debe aparecer en la acción y en su ayuda contextual."},{"thing":"Mapa UX y catálogo de componentes en la navegación del producto","reason":"Interrumpen el trabajo operativo. Deben consultarse en el informe de decisiones separado."},{"thing":"KPI grandes sin acción ni denominador","reason":"No permiten investigar. Se sustituyen por contadores compactos que aplican filtros a los datos de origen."},{"thing":"Actividad con frases genéricas sin referencias","reason":"No permite verificar qué sucedió. Cada evento debe enlazar su intento, hallazgo o política y tener timestamp."},{"thing":"Semilla, modelo, superficie o presupuesto sin efecto en la ejecución","reason":"Prometen capacidades que los endpoints actuales no ejecutan. Se ocultan o se identifican como diseño pendiente."},{"thing":"Resultados y barras determinados por objetivo y versión","reason":"Confunden una interacción simulada con evidencia. Los resultados deben derivarse de eventos y evaluaciones reales o indicar reproducción simulada."},{"thing":"JSON bruto como inspector principal","reason":"Dificulta localizar argumentos, decisiones y evidencias. Se conserva como pestaña secundaria junto al inspector estructurado."}],"gaps":[{"priority":"P0","journey":"Preparar ejecución","missing":"Procedencia, antigüedad y alcance de los datos visibles","presentation":"Franja persistente con ejecución, fecha, commit, modelo, fixture y modo live/captura/playback; detalle de origen desplegable.","why":"Un técnico necesita distinguir observación actual, captura histórica y simulación antes de interpretar resultados.","backendStatus":"Parcial: el snapshot contiene run_id, captured_at, commit, model y provider; los contratos de arena no exponen un manifiesto completo de ejecución."},{"priority":"P0","journey":"Diagnosticar fallo de proveedor","missing":"Error, reintentos, circuit breaker y alcance de los intentos afectados","presentation":"Aviso compacto de proveedor degradado enlazado al ledger, llamadas fallidas y los intentos inconclusos.","why":"La captura actual contiene APIConnectionError y breaker_open. Esos fallos no constituyen bloqueos defensivos.","backendStatus":"Datos disponibles en calls y assessment del snapshot; fleet/status expone estado y presupuesto, sin una vista pública completa del breaker."},{"priority":"P0","journey":"Abrir participación","missing":"Capacidad real de identidades, admisión y acceso público","presentation":"Control de entradas con plazas ocupadas/3, URL copiable y QR de esa URL; estado verificable de acceso.","why":"El escenario admite tres identidades sintéticas. El operador debe anticipar cuándo otra persona no podrá unirse.","backendStatus":"Creación y cupo implementados; no hay listado de sesiones operativo ni endpoint de plazas; QR y despliegue pendientes."},{"priority":"P0","journey":"Dirigir demo","missing":"Selección de evidencia que verá la audiencia","presentation":"Acción Fijar para proyección en intento, hallazgo y comparación; preview del contenido publicado y fase actual.","why":"El presentador necesita conducir una historia verificable sin buscar una traza delante del público.","backendStatus":"Propuesto: no hay contrato de estado editorial de proyección."},{"priority":"P0","journey":"Pausar y revelar","missing":"Diferencia entre cerrar admisión, drenar cola y revelar resultados","presentation":"Acción contextual Cerrar entradas → Esperando N intentos → Revelar, con campaña activa y motivo de bloqueo visibles.","why":"Revelar antes del drenaje devuelve 409; un control sin estado hace que el demo parezca roto.","backendStatus":"Pausa, apertura, revelación y validación de drenaje implementadas; contador explícito de cola requiere derivación de intentos o contrato adicional."},{"priority":"P0","journey":"Reiniciar ensayo","missing":"Archivado y alcance explícito de una ronda nueva","presentation":"Asistente que muestra qué se archiva y qué se restablece: política, memoria, efectos, sesiones y clasificación.","why":"Revertir una política no deshace lecturas, reembolsos o memoria. La evidencia anterior debe seguir revisable.","backendStatus":"Pendiente: hoy una ejecución limpia usa un directorio de datos nuevo; no existe reset de ronda con archivado por API."},{"priority":"P0","journey":"Encontrar un intento","missing":"Exploración densa y filtros combinables","presentation":"Tabla con ID, fecha, origen, sesión, objetivos, versión, estado, resultado, ruta privada y herramientas; búsqueda y contadores filtrables.","why":"Las listas de tarjetas no permiten comparar decenas de casos ni aislar rápidamente una regresión.","backendStatus":"GET /api/operator/attempts implementado; algunos campos y tiempos se derivan del detalle/eventos. La API devuelve todos los intentos sin paginación."},{"priority":"P0","journey":"Inspeccionar intento","missing":"Cadena navegable de mensaje, herramienta, decisión, efecto y evaluación","presentation":"Panel dividido con cronología y detalle de argumentos/salida; pestañas Resumen, Herramientas, Oráculos, LLM y JSON.","why":"El usuario debe entender qué ejecutó el sistema y dónde se aplicó una defensa, sin leer un documento JSON completo.","backendStatus":"Detalle operativo y eventos por intento implementados en GET /api/operator/attempts/{id}."},{"priority":"P0","journey":"Verificar un veredicto","missing":"Vínculo directo entre evaluación y eventos que la sustentan","presentation":"Un renglón por objetivo con violated, action/disclosure, detalle y IDs de evidencia clicables que resaltan la llamada exacta.","why":"Una lectura indebida cuenta aunque la respuesta final la oculte; la respuesta del modelo por sí sola no prueba el resultado.","backendStatus":"assessment.verdicts, evidence_event_ids y prevented_event_ids implementados."},{"priority":"P0","journey":"Interpretar resultados","missing":"Diferencia semántica entre los cinco resultados y objetivos múltiples","presentation":"Etiquetas con texto y color para violación, prevención, no logrado, señuelo e inconcluso; varios objetivos por intento y explicación breve.","why":"No lograr un ataque, bloquearlo con una regla y fallar por infraestructura representan hechos distintos.","backendStatus":"Enums y oráculos implementados; los intentos públicos proyectan violación/señuelo como apparent_success."},{"priority":"P0","journey":"Reproducir ataque","missing":"Condiciones exactas y vínculo entre original y replay","presentation":"Acción Repetir con vN actual que muestra mensajes, identidad y sesión protegida nueva; comparación enlazada al original.","why":"Repetir en una sesión ya desviada al señuelo no demuestra mitigación en el entorno protegido.","backendStatus":"POST /api/operator/attempts/{id}/replay implementado con política actual y sesión interna nueva; selección arbitraria de versión no implementada."},{"priority":"P0","journey":"Investigar hallazgo","missing":"Control ausente, evidencia agrupada, versiones afectadas y reaperturas","presentation":"Lista de hallazgos con inspector y timeline: objetivo → herramienta → control → intentos/eventos → candidato → validación.","why":"Una vulnerabilidad necesita una unidad estable de seguimiento y evidencia acumulada, separada de un mensaje de ataque.","backendStatus":"FindingService expone tool, missing_control, affected_policy_version, attempt_ids, evidence_event_ids y estados open/mitigated/reopened."},{"priority":"P0","journey":"Revisar defensa","missing":"Diff de reglas, parent, hash y hallazgos cubiertos","presentation":"Diff estructurado entre versión padre y candidato, controles heredados/agregados y enlaces a hallazgos y evidencia.","why":"Los ingenieros necesitan verificar qué cambió y si el parche corresponde al fallo observado.","backendStatus":"GET /api/operator/policies devuelve parent_version, rules, content_hash, finding_ids, reason y validation."},{"priority":"P0","journey":"Evaluar candidato","missing":"Resultados individuales de los ocho casos y separación L1/L2","presentation":"Matriz de original, reserved-1/2 y cinco tareas legítimas con passed, outcome, error y alcance; estado L1 separado.","why":"Un 8/8 agregado oculta qué utilidad se verificó o qué caso produjo la regresión.","backendStatus":"Reporte de validación resumido implementado; trazas individuales de validación se capturan en memoria y no quedan disponibles para drilldown durable."},{"priority":"P0","journey":"Activar o revertir","missing":"Precondiciones, versión vigente, espera de drenaje y efectos del rollback","presentation":"Estado candidato → validando → pendiente de drenaje → activo/rechazado; rollback con diff de controles y razón obligatoria.","why":"El cambio exige validación aprobada y padre vigente. Revertir políticas no restaura el estado de negocio anterior.","backendStatus":"Activación automática, lifecycle, stale_parent, drenaje, rollback y reapertura de hallazgos implementados; activación manual pública no expuesta."},{"priority":"P1","journey":"Inspeccionar sesión","missing":"Identidad fijada, pedidos propios, historial y cambios de ruta","presentation":"Tabla y panel de sesión con intentos por versión, destino privado y evento de desvío con reason y timestamp.","why":"La identidad proviene del servidor y el desvío al señuelo es permanente para esa sesión; ambos condicionan los experimentos.","backendStatus":"Modelos y eventos implementados; no hay GET operativo para listar o detallar sesiones."},{"priority":"P1","journey":"Investigar memoria","missing":"Entradas, procedencia, turno de origen y cuarentena","presentation":"Inspector de memoria con clave/valor, ámbito, evidencia y antes/después; Sin inspección disponible cuando el dato no esté expuesto.","why":"Un contador de entradas no explica una contaminación persistente ni la limpieza aplicada al activar una defensa.","backendStatus":"Memoria cifrada, procedencia y cuarentena implementadas; endpoint de lectura por sesión no disponible."},{"priority":"P1","journey":"Verificar efectos","missing":"Lecturas y escrituras de negocio separadas de la respuesta","presentation":"Registro de efectos por entorno, pedido e intento; reembolso acumulado y comparación antes/después cuando haya evidencia.","why":"Reembolsos fraccionados y permisos persistidos requieren revisar secuencias y estado, no solo un texto de respuesta.","backendStatus":"Efectos persistidos y oráculos implementados; consulta operativa estructurada de DB/efectos no expuesta."},{"priority":"P1","journey":"Gestionar Prober","missing":"Progreso, casos, resultados y alcance real de la campaña","presentation":"Tabla de campañas con max_attempts, usados, estado, stop y enlaces a intentos; cobertura por familia/objetivo con denominador.","why":"Un contador aislado no permite saber qué exploró el atacante ni si produce evidencia nueva.","backendStatus":"Start/list/stop y attempt_ids implementados; actual genera plantillas de tres familias. Detalle completo de caso y vínculo campaign_id no están en attempt_view."},{"priority":"P1","journey":"Controlar consumo","missing":"Coste y tokens con cobertura de medición y presupuesto","presentation":"Resumen por rol/intento/campaña con llamadas, uso, coste, límite y distinción entre 0 medido, ausente y estimado.","why":"La captura actual tiene seis llamadas sin usage. Mostrar $0 como consumo medido total ocultaría esa limitación.","backendStatus":"Ledger/usage presentes en snapshot y presupuesto en fleet/status; no hay contrato operativo completo de consumo por scope."},{"priority":"P0","journey":"Entrar como participante","missing":"Errores de ingreso diferenciados y contexto de la simulación","presentation":"Ingreso con reglas, alias, plazas, identidad/pedidos asignados; mensajes específicos para alias ocupado, cupo agotado y datos inválidos.","why":"El mensaje genérico de error actual no explica cómo recuperarse ni que solo existen tres plazas.","backendStatus":"POST /api/sessions y validaciones implementados; el frontend reduce causas distintas a un error genérico."},{"priority":"P0","journey":"Atacar desde el chat","missing":"Historial, secuencias de hasta cuatro mensajes y recuperación al recargar","presentation":"Conversación con intentos anclados, modo mensaje/secuencia, 4000 caracteres, borrador persistente y recuperación de token/historial.","why":"Los ataques de memoria o varios turnos necesitan revisar contexto y conservar el acceso al resultado propio.","backendStatus":"message/messages hasta cuatro e idempotencia implementados; frontend actual conserva solo el último intento y pierde sesión al recargar; listado de historial público no expuesto."},{"priority":"P0","journey":"Esperar y recuperar envío","missing":"Progreso, versión fijada y errores accionables","presentation":"Estado queued/running/evaluated/inconclusive, ID copiable, hora y versión; mantener borrador y explicar 429, 409 y token vencido.","why":"La espera sin estado parece un bloqueo y reintentar sin control puede confundir la lectura del experimento.","backendStatus":"Estado, versión, timestamps, idempotencia y errores HTTP implementados; posición exacta de cola y Retry-After no expuestos."},{"priority":"P0","journey":"Leer resultado provisional y final","missing":"Marco honesto separado de la respuesta y explicación de reconciliación","presentation":"Respuesta del vo.","Conectar intento, sesión, run, evento, oráculo, hallazgo y versión sin perder filtros ni contexto.","Separar herramientas propuestas, negadas y ejecutadas de lo que afirma la respuesta del modelo.","La consola prioriza densidad y profundidad; la proyección una evidencia legible por fase; el participante contexto propio y recuperación.","Mantener rutas, canarios y secretos fuera de las proyecciones públicas no autorizadas.","Representar capacidades pendientes como pendientes; una maqueta interactiva no demuestra integración.","Conservar el origen humano, Prober o preparado y el alcance de cada comparación.","Reservar color para estado y evidencia; ofrecer texto, contraste y navegación por teclado.","Usar tablas, inspectores ajustables, diffs y timelines vinculados cuando ayuden a trabajar; evitar cajas que solo repiten instrucciones."],"journeys":[{"role":"Operador presentador","steps":["Verificar ejecución, proveedor, presupuesto, acceso y fixture","Ejecutar tarea legítima preparada","Ejecutar y fijar la grieta inicial","Abrir entradas y campaña con origen visible","Seguir evidencia, candidato, pruebas y activación","Cerrar entradas y drenar","Repetir ataque en sesión protegida nueva y comprobar utilidad","Revelar y reconciliar clasificación","Exportar evidencia y archivar antes de una ronda nueva"]},{"role":"Investigador técnico","steps":["Elegir ejecución y procedencia","Filtrar intentos por objetivo, resultado, versión y origen","Inspeccionar argumentos, decisiones, efectos y reintentos","Saltar del veredicto al evento exacto","Abrir sesión, memoria y ruta cuando estén disponibles","Seguir hallazgo al diff y matriz de validación","Comparar replay controlado con original","Revisar regresiones, rollback y límites de la evidencia"]},{"role":"Participante técnico","steps":["Entrar por URL o QR y comprobar admisión","Aceptar simulación y obtener identidad/pedidos propios","Probar una consulta legítima","Preparar mensaje o secuencia adversaria","Enviar con límites e idempotencia","Seguir cola, ejecución y resultado provisional","Conservar historial y recuperar acceso tras recarga","Consultar resultado propio verificado al cerrar la ronda"]},{"role":"Audiencia o jurado","steps":["Ver que la tarea legítima tiene utilidad","Ver la llamada indebida y su efecto","Participar o seguir la actividad agregada","Entender qué control cambió y qué pruebas pasó","Comparar el mismo ataque antes y después","Ver que la tarea legítima sigue funcionando","Comprender el señuelo y la clasificación reconciliada","Revisar resultados reales, inconclusos y alcance"]}],"apiGaps":[{"capability":"Manifiesto y ciclo de vida de ejecución/ronda","status":"Pendiente","evidence":"docs/nucleo.md indica que un ensayo limpio usa directorio nuevo y lista reinicio con archivado entre los pendientes; el snapshot ya contiene metadatos útiles."},{"capability":"Listado/detalle operativo de sesiones y plazas","status":"Pendiente","evidence":"backend/src/agent_zero/sessions/router.py expone creación; create_session fija un límite de tres identidades. No existe listado en operator_router.py."},{"capability":"Lectura de memoria, procedencia y cuarentena por sesión","status":"Pendiente","evidence":"La memoria existe en backend; memory_bank/router.py expone borrado por sujeto, sin un inspector por sesión."},{"capability":"Consulta operativa de efectos de negocio","status":"Pendiente","evidence":"Los oráculos verifican efectos en protected/honeypot y reembolsos persistidos, pero operator_router.py no ofrece consulta estructurada de esos registros."},{"capability":"Inspección durable de cada caso de validación","status":"Parcial","evidence":"patches/validation_runner.py devuelve name, adversarial, passed, outcome/error; TraceObserver.capture guarda eventos en memoria y release los elimina."},{"capability":"Replay con versión arbitraria y fixture limpio seleccionable","status":"Parcial","evidence":"POST /api/operator/attempts/{id}/replay usa mensajes originales, sesión interna nueva y política activa al enviar; no acepta versión, modelo o seed."},{"capability":"Historial público recuperable de sesión","status":"Parcial","evidence":"GET /api/attempts/{id} autoriza lectura del propietario; no hay listado público por sesión. ParticipantPage conserva token solo en estado React."},{"capability":"Resultado final propio reconciliado","status":"Parcial","evidence":"attempt_view convierte confirmed_violation y contained_honeypot en apparent_success para toda vista pública; ArenaService sí recalcula clasificación con revealed."},{"capability":"Estado editorial para proyección","status":"Pendiente","evidence":"ArenaService publica accepting, revealed, policy_version, attempts y scores; no hay entidad para fijar intento, comparación o fase del guion."},{"capability":"Ledger de LLM consultable por intento/campaña y salud de breaker","status":"Parcial","evidence":"runtime-snapshot.json incluye calls y usage; fleet/status expone modo, gasto y límite. No hay endpoint operativo completo del ledger por scope."},{"capability":"Metadatos completos de campaña/caso en UI","status":"Parcial","evidence":"CampaignService expone id/status/max_attempts/attempt_ids/created_at. AttackCase define familia, superficie, seed y parent; attempt_view no proyecta campaign_id ni el caso completo."},{"capability":"Evaluación amplia repetida y reporte antes/después","status":"Pendiente","evidence":"docs/nucleo.md distingue los ocho casos de activación de la suite pendiente de 30 adversarios y 15 legítimos con tres repeticiones."}]}</script>

<script>
/* Agent Zero snapshot adapter. No network calls, mutations, or fabricated results. */
(function (global) {
  "use strict";

  const OUTCOMES = {
    confirmed_violation: ["Violación confirmada", "danger"],
    prevented: ["Bloqueado", "success"],
    not_achieved: ["No logrado", "neutral"],
    contained_honeypot: ["Contenido en señuelo", "success"],
    inconclusive: ["Inconcluso", "warning"],
    apparent_success: ["Éxito aparente", "warning"],
  };
  const ACTION_LABELS = {
    baseline_attack: "Ataque base",
    protected_replay: "Reproducción",
    legitimate_before: "Control legítimo · antes",
    legitimate_after: "Control legítimo · después",
    followup_same_session: "Continuación de sesión",
    legitimate_memory: "Control de memoria",
  };
  const USAGE_FIELDS = ["input_tokens", "output_tokens", "cache_read_tokens", "cache_write_tokens"];
  const COST_FIELDS = ["input_usd", "output_usd", "cache_read_usd", "cache_write_usd"];
  const list = (value) => Array.isArray(value) ? value : [];
  const key = (value) => typeof value === "string" ? value.toLowerCase() : "";
  const number = (value) => typeof value === "number" && Number.isFinite(value) && value >= 0;
  const unique = (values) => [...new Set(values.filter((value) => value != null && value !== ""))];

  function timeMs(value) {
    if (typeof value !== "string" || !value.trim()) return null;
    let iso = value.trim().replace(/^(\d{4}-\d{2}-\d{2}) /, "$1T");
    // SQLite stores UTC without an offset; never interpret it in the browser's local zone.
    if (iso.includes("T") && !/(?:z|[+-]\d{2}:?\d{2})$/i.test(iso)) iso += "Z";
    const result = Date.parse(iso);
    return Number.isFinite(result) ? result : null;
  }

  function shortId(value) {
    if (value == null || value === "") return "—";
    const id = String(value);
    return id.length > 17 ? id.slice(0, 8) + "…" + id.slice(-6) : id;
  }

  function formatTime(value) {
    const ms = timeMs(value);
    if (ms == null) return "—";
    return new Intl.DateTimeFormat("es-VE", {
      timeZone: "UTC", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23",
    }).format(ms) + " UTC";
  }

  function duration(value) {
    if (!number(value)) return "—";
    if (value < 1000) return (value < 10 ? value.toFixed(1) : Math.round(value)) + " ms";
    if (value < 60000) return (value / 1000).toFixed(value < 10000 ? 2 : 1) + " s";
    const seconds = Math.floor(value / 1000);
    if (seconds < 3600) return Math.floor(seconds / 60) + "m " + (seconds % 60) + "s";
    return Math.floor(seconds / 3600) + "h " + Math.floor((seconds % 3600) / 60) + "m";
  }

  function outcomeLabel(value) {
    return OUTCOMES[key(value)]?.[0] || (value ? String(value) : "Pendiente");
  }

  function outcomeTone(value) {
    return OUTCOMES[key(value)]?.[1] || "neutral";
  }

  function totalFrom(record, fields, totalField) {
    if (record == null || typeof record !== "object") return null;
    if (number(record[totalField])) return record[totalField];
    const present = fields.filter((field) => number(record[field]));
    return present.length ? present.reduce((sum, field) => sum + record[field], 0) : null;
  }

  function knownSum(values) {
    const known = values.filter(number);
    return known.length ? known.reduce((sum, value) => sum + value, 0) : null;
  }

  function dedupeEvents(events) {
    const seen = new Set();
    return events.filter((event) => {
      if (!event || typeof event !== "object") return false;
      const identity = event.id != null
        ? "id:" + event.id
        : JSON.stringify([event.type, event.timestamp, event.attempt_id, event.session_id, event.data]);
      if (seen.has(identity)) return false;
      seen.add(identity);
      return true;
    }).sort((a, b) => {
      const at = timeMs(a.timestamp), bt = timeMs(b.timestamp);
      if (at != null && bt != null && at !== bt) return at - bt;
      return (Number(a.id) || 0) - (Number(b.id) || 0);
    });
  }

  function toolOperations(events) {
    const operations = new Set();
    let uncorrelatedTerminals = 0;
    for (const event of events) {
      const type = key(event.type);
      if (!type.startsWith("tool_")) continue;
      const operation = event.data?.operation_id;
      if (operation) operations.add(operation);
      // A proposal without an operation ID is not another call. With no correlation,
      // terminal events are the only countable evidence; dedupeEvents removed repeats.
      else if (type === "tool_completed" || type === "tool_denied") uncorrelatedTerminals += 1;
    }
    return operations.size + uncorrelatedTerminals;
  }

  function firstTime(events, type) {
    for (const event of events) {
      if (key(event.type) !== type) continue;
      const at = timeMs(event.timestamp);
      if (at != null) return at;
    }
    return null;
  }

  function delta(start, end) {
    return start != null && end != null && end >= start ? end - start : null;
  }

  function normalize(snapshot) {
    const raw = snapshot && typeof snapshot === "object" ? snapshot : {};
    const events = dedupeEvents(list(raw.events));
    const rawSessions = list(raw.sessions);
    const sessionById = new Map(rawSessions.map((session) => [session.id, session]));
    const actions = new Map(list(raw.actions).map((action) => [action.attempt_id, action]));
    const campaignByAttempt = new Map();
    for (const campaign of list(raw.campaigns)) {
      for (const attemptId of list(campaign.attempt_ids)) campaignByAttempt.set(attemptId, campaign.id);
    }

    const calls = list(raw.calls).map((call) => {
      const tokens = totalFrom(call.usage, USAGE_FIELDS, "total_tokens");
      const costUsd = totalFrom(call.cost, COST_FIELDS, "total_usd");
      return {
        ...call, raw: call, scope: { ...(call.scope || {}) },
        usageKnown: tokens != null, costKnown: costUsd != null, tokens, costUsd,
      };
    });

    const attempts = list(raw.attempts).map((attempt) => {
      const sessionId = attempt.session_id ?? attempt.sessionId ?? null;
      const session = sessionById.get(sessionId);
      const action = actions.get(attempt.id);
      const attemptEvents = dedupeEvents([
        ...list(attempt.events), ...events.filter((event) => event.attempt_id === attempt.id),
      ]);
      const attemptCalls = calls.filter((call) => call.scope.attempt_id === attempt.id);
      const queuedAt = firstTime(attemptEvents, "attempt_queued");
      const startedAt = firstTime(attemptEvents, "attempt_started");
      const completedAt = firstTime(attemptEvents, "attempt_completed");
      const evaluatedAt = firstTime(attemptEvents, "attempt_evaluated");
      const verdicts = list(attempt.assessment?.verdicts);
      const campaignId = attempt.campaign_id || campaignByAttempt.get(attempt.id) || null;
      const origin = key(attempt.origin);
      const sourceLabel = ACTION_LABELS[action?.label]
        || (campaignId ? "Prober · " + shortId(campaignId)
          : origin === "audience" ? "Audiencia"
          : origin === "autonomous" ? "Autónomo"
          : origin || "Origen desconocido");
      return {
        ...attempt,
        raw: attempt,
        id: attempt.id ?? null,
        sessionId,
        alias: session?.alias || shortId(sessionId),
        customer: session?.customer_name || attempt.customer_id || session?.customer_id || null,
        customerId: attempt.customer_id || session?.customer_id || null,
        objectiveIds: unique(verdicts.map((verdict) => verdict.objective_id)),
        violatedObjectiveIds: unique(verdicts.filter((verdict) => verdict.violated === true).map((verdict) => verdict.objective_id)),
        declaredObjectiveId: attempt.objective_id ?? null,
        policyVersion: attempt.policy_version ?? attempt.policyVersion ?? null,
        route: key(attempt.route) || null,
        status: key(attempt.status) || null,
        outcome: key(attempt.outcome) || null,
        messages: list(attempt.messages).slice(),
        reply: typeof attempt.reply === "string" ? attempt.reply : "",
        createdAt: attempt.created_at ?? attempt.createdAt ?? null,
        events: attemptEvents,
        calls: attemptCalls,
        toolCount: toolOperations(attemptEvents),
        queueMs: delta(queuedAt, startedAt),
        executionMs: delta(startedAt, completedAt),
        totalMs: delta(queuedAt ?? timeMs(attempt.created_at), evaluatedAt ?? completedAt),
        usageKnown: attemptCalls.some((call) => call.usageKnown),
        tokens: knownSum(attemptCalls.map((call) => call.tokens)),
        costUsd: knownSum(attemptCalls.map((call) => call.costUsd)),
        campaignId,
        sourceLabel,
        label: action?.label ?? null,
        legitimate: typeof action?.legitimate === "boolean" ? action.legitimate : null,
      };
    });

    const sessionIds = unique([...rawSessions.map((session) => session.id), ...attempts.map((attempt) => attempt.sessionId)]);
    const sessions = sessionIds.map((id) => {
      const session = sessionById.get(id);
      const sessionAttempts = attempts.filter((attempt) => attempt.sessionId === id);
      const routeEvents = events.filter((event) => event.session_id === id && key(event.type) === "route_changed");
      const lastRoute = routeEvents.length ? routeEvents[routeEvents.length - 1].data?.route : null;
      return {
        ...(session || {}), raw: session || null, id,
        alias: session?.alias || shortId(id),
        customer: session?.customer_name || session?.customer_id || sessionAttempts[0]?.customer || null,
        customerId: session?.customer_id || sessionAttempts[0]?.customerId || null,
        createdAt: session?.created_at ?? null,
        route: key(session?.route) || key(lastRoute) || sessionAttempts[sessionAttempts.length - 1]?.route || null,
        orderIds: Array.isArray(session?.order_ids) ? session.order_ids.slice() : null,
        order_ids: Array.isArray(session?.order_ids) ? session.order_ids.slice() : null,
        attempts: sessionAttempts,
        events: events.filter((event) => event.session_id === id),
        routeEvents,
        memory: null,
        memoryCount: null,
        inferred: !session,
      };
    });

    const findings = list(raw.findings).map((finding) => ({ ...finding, raw: finding }));
    const policies = list(raw.policies).map((policy) => ({ ...policy, raw: policy }));
    const byOutcome = Object.fromEntries(Object.keys(OUTCOMES).map((outcome) => [outcome, 0]));
    for (const attempt of attempts) {
      if (attempt.outcome) byOutcome[attempt.outcome] = (byOutcome[attempt.outcome] || 0) + 1;
    }
    const fromAction = (label) => attempts.find((attempt) => attempt.label === label) || null;
    const hasComparisonAction = attempts.some((attempt) => ["baseline_attack", "protected_replay", "legitimate_before", "legitimate_after"].includes(attempt.label));
    const stats = {
      totalAttempts: attempts.length,
      byOutcome,
      outcomes: byOutcome,
      queued: attempts.filter((attempt) => attempt.status === "queued").length,
      running: attempts.filter((attempt) => attempt.status === "running").length,
      toolOperations: attempts.reduce((sum, attempt) => sum + attempt.toolCount, 0),
      calls: calls.length,
      measuredUsageCalls: calls.filter((call) => key(call.origin) === "live" && call.usageKnown).length,
      usageKnownCalls: calls.filter((call) => call.usageKnown).length,
      unknownUsageCalls: calls.filter((call) => !call.usageKnown).length,
      costKnownCalls: calls.filter((call) => call.costKnown).length,
      tokens: knownSum(calls.map((call) => call.tokens)),
      costUsd: knownSum(calls.map((call) => call.costUsd)),
      openFindings: findings.filter((finding) => ["open", "reopened"].includes(key(finding.status))).length,
      sessionCount: sessions.length,
    };
    return {
      raw,
      id: raw.run_id ?? raw.id ?? null,
      capturedAt: raw.captured_at ?? raw.capturedAt ?? null,
      provider: raw.provider ?? null,
      model: raw.model ?? null,
      arena: { ...(raw.arena || {}) },
      attempts, sessions, findings, policies, events, calls,
      usage: list(raw.usage).map((usage) => ({ ...usage })),
      stats,
      comparison: hasComparisonAction ? {
        before: fromAction("baseline_attack"),
        after: fromAction("protected_replay"),
        legitBefore: fromAction("legitimate_before"),
        legitAfter: fromAction("legitimate_after"),
      } : null,
    };
  }

  global.ZeroData = Object.freeze({ normalize, shortId, formatTime, duration, outcomeLabel, outcomeTone });
})(typeof window !== "undefined" ? window : globalThis);

(function () {

  const e = value => String(value ?? '').replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));

  const names = {'OBJ-ORDER':'Pedido ajeno','OBJ-REFUND':'Reembolso indebido','OBJ-MEMORY':'Memoria y permisos'};
  const eventTitles = {attempt_queued:'Intento aceptado',attempt_started:'Runtime iniciado',tool_proposed:'Herramienta propuesta',tool_completed:'Herramienta ejecutada',tool_denied:'Acción denegada',attempt_completed:'Respuesta completada',attempt_evaluated:'Oráculos evaluados',route_changed:'Destino de sesión actualizado',finding_opened:'Hallazgo confirmado',patch_proposed:'Candidato propuesto',patch_validated:'Validación completada',policy_activated:'Política activada',policy_rolled_back:'Política revertida',llm_call:'Llamada al modelo'};
  const mainTabs = [['trace','Ejecución'],['oracles','Oráculos'],['llm','LLM'],['context','Contexto'],['json','JSON']];
  const nav = [['runs','Trazas','list-tree'],['defense','Defensa','shield-check'],['compare','Diff','git-compare-arrows'],['sessions','Sesión','users-round'],['campaigns','Prober','bot'],['telemetry','LLM','activity'],['demo','Demo','clapperboard']];
  const initial = datasets.findIndex(x=>x.provider==='playback');
  const state = {dataset:Math.max(0,initial),mode:'operator',view:'runs',attempt:null,event:null,mainTab:'trace',inspectTab:'detail',policy:null,session:null,search:'',outcome:'all',origin:'all',order:'asc',listExpanded:true,stage:'compare',revealPreview:false,telemetryTab:'calls',width:210,modal:null,auditTab:'gaps',paletteQuery:'',draft:''};
  const saved = window.openai?.widgetState?.privateContent;
  if(saved?.schema===2&&saved.dataset>=0&&saved.dataset<datasets.length)Object.assign(state,saved.ui);

    if(!data.sessions.some(s=>s.id===state.session))state.session=data.attempts.find(a=>a.id===state.attempt)?.sessionId||data.sessions[0]?.id||null;
  }
  function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{vista:state.mode,pantalla:state.view,fuente:data.provider,ejecucion:state.attempt,politica:state.policy,evento:state.event},privateContent:{schema:2,dataset:state.dataset,ui:{...state,modal:null,paletteQuery:'',draft:state.draft.slice(0,1600)}}}).catch(()=>{});}

  function status(a,publicView=false){

    if(['queued','running'].includes(a.status)){label=a.status==='queued'?'En cola':'Ejecutándose';tone='warning';icon='loader-circle';}

'z-ghost z-tiny','arrow-up-right')).join('')}</div></article>`).join('')||'<p class="z-micro z-dim">Esta versión no referencia hallazgos.</p>'}${sec('PROTOCOLO DE ACTIVACIÓN')}${cases.length?`<div class="z-validation-head"><div><strong class="z-good">${cases.filter(c=>c.passed).length}/${cases.length}</strong><span class="z-micro z-dim">Casos aprobados</span></div><div><strong>${cases.filter(c=>c.adversarial).length} + ${cases.filter(c=>!c.adversarial).length}</strong><span class="z-micro z-dim">Adversarios + legítimos</span></div><div><strong>${dur(validation.seconds*1000)}</strong><span class="z-micro z-dim">Validación registrada</span></div><div><strong>${validation.repetitions??'—'}×</strong><span class="z-micro z-dim">Repeticiones</span></div></div>${validationMatrix(cases)}${callout(`Nivel 1: contrafactual ${validation.level1_passed?'aprobado':'sin aprobar'}. Nivel 2: ${cases.filter(c=>c.passed&&c.adversarial).length}/${cases.filter(c=>c.adversarial).length} adversarios seguros y ${cases.filter(c=>c.passed&&!c.adversarial).length}/${cases.filter(c=>!c.adversarial).length} tareas legítimas útiles. Las trazas detalladas por prueba aún no se persisten.`,validation.passed?'success':'warning')}`:callout(policy.version===0?'Esta es la política base; no representa una defensa generada ni una suite de ocho casos.':'No hay informe de validación disponible.')}<div class="z-row z-between"><span class="z-micro z-dim">Fuente: policy_versions.validation · ${e(validation.llm_mode||data.provider)}</span>${B('Ver JSON de política','json-policy',policy.version,'z-ghost','braces')}</div></div></div>`;

  function validationMatrix(cases){return `<div class="z-tablewrap"><table><thead><tr><th>Caso</th><th>Tipo</th><th>Veredicto</th><th>Prueba</th><th>Error</th></tr></thead><tbody>${cases.map((c,i)=>`<tr><td class="z-mono">${String(i+1).padStart(2,'0')} / ${e(c.name)}</td><td>${c.adversarial?'Adversario':'Legítimo'}</td><td>${e(Z.outcomeLabel(c.outcome))}</td><td>${tag(c.passed?'PASS':'FAIL',c.passed?'success':'danger')}</td><td class="z-mono">${e(c.error||'—')}</td></tr>`).join('')}</tbody></table></div>`;}

ss="z-row">${status(a,true)}<span class="z-mono z-dim">${e(short(a.id))}</span></div></div></div></div>`;}).join('')}<form class="z-composer" data-form="draft"><label for="z-draft" class="z-upper">PREPARAR MENSAJE / SIN ENVÍO A API</label><textarea id="z-draft" maxlength="16000" placeholder="Escribe un mensaje o hasta cuatro turnos, uno por línea…">${e(state.draft)}</textarea><div class="z-row z-between"><span class="z-micro z-dim"><span id="z-draft-count">${state.draft.length}</span> caracteres · 4 turnos / 4000 por turno</span><button type="submit" class="z-button cursor-interaction">${I('copy')}Copiar payload</button></div></form><p class="z-micro z-dim">Esta vista permite leer la conversación pública de una captura. No envía intentos nuevos ni recibe la ruta privada de la sesión en un despliegue real.</p></section></main>`;

  function openModal(kind,value=''){returnFocus=document.activeElement;state.modal={kind,value};ui.inert=true;renderModal();modal.scrollIntoView?.({block:'start'});(modal.querySelector('input,select')||modal.querySelector('button'))?.focus({preventScroll:true});}

    }else{

      else if(kind==='global-event'){obj=data.events.find(ev=>String(ev.id)===String(value));title='Evento #'+value+' · registro original';}

      body=`<div class="z-row">${B('Copiar JSON','copy-modal','','','copy')}${B(kind==='export'?'Descargar captura completa':'Descargar JSON','download-modal','','z-primary','download')}</div><div id="z-modal-data">${jsonTree(obj||{},0,true)}</div>`;

  function sizeModal(){const h=modal.querySelector('.z-modal')?.getBoundingClientRect().height;if(h)root.style.minHeight=Math.ceil(h+110)+'px';}
  function commandResults(query){
    const q=query.toLowerCase();
    const results=[...data.attempts.map(a=>({kind:'attempt',id:a.id,label:a.messages.join(' → '),detail:a.sourceLabel+' · v'+a.policyVersion+' · '+Z.outcomeLabel(a.outcome)+' · '+[...new Set(a.events.map(x=>x.data?.tool).filter(Boolean))].join(' '),icon:'list-tree'})),...data.sessions.map(s=>({kind:'session',id:s.id,label:s.alias,detail:s.id+' · '+s.customer,icon:'users-round'})),...data.policies.map(p=>({kind:'policy',id:p.version,label:'Política v'+p.version,detail:(p.rules||[]).join(' · ')||'Base de laboratorio',icon:'shield-check'}))].filter(x=>!q||[x.label,x.detail,String(x.id)].join(' ').toLowerCase().includes(q)).slice(0,9);
    return `<div class="z-palette-results">${results.map(r=>`<button type="button" class="z-palette-result cursor-interaction" data-action="command-result" data-value="${r.kind}|${e(r.id)}">${I(r.icon)}<span><strong>${e(r.label)}</strong><span class="z-table-sub">${e(r.detail)}</span></span></button>`).join('')||'<p class="z-micro z-dim">Sin coincidencias en esta captura.</p>'}</div>`;

  function makePayload(){const turns=state.draft.split('\n').map(x=>x.trim()).filter(Boolean);return {messages:turns,idempotency_key:'GENERAR_UNA_CLAVE_POR_INTENTO'};}
  function modalObject(){const {kind,value}=state.modal||{};if(kind==='call')return data.calls.find(c=>c.call_id===value)?.raw;if(kind==='json-policy')return data.policies.find(p=>p.version===Number(value))?.raw;if(kind==='global-event')return data.events.find(ev=>String(ev.id)===String(value));if(kind==='payload')return makePayload();return data.raw;}
  function copy(text){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Copiado.')).catch(()=>showCopy(text));else showCopy(text);}
  function showCopy(text){openModal('payload');const el=document.getElementById('z-modal-data');el.innerHTML=code(text);const range=document.createRange();range.selectNodeContents(el);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);sizeModal();toast('Texto seleccionado para copiar.');}
  function download(object,name){const blob=new Blob([JSON.stringify(object,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download=name;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function chooseAttempt(id,eventId=null){if(!data.attempts.some(a=>a.id===id)){toast('Ese intento no está incluido en la captura.');return;}state.mode='operator';state.view='runs';state.attempt=id;state.event=eventId;state.mainTab='trace';render();persist();}

  function handleAction(action,value){
    if(action==='mode'){state.mode=value;render();persist();return;}
    if(action==='view'){state.mode='operator';state.view=value;render();persist();return;}
    if(action==='dataset'){if(Number(value)<0)return;setData(value);state.outcome='all';state.origin='all';state.search='';render();persist();return;}
    if(action==='attempt'){chooseAttempt(value);return;}
    if(action==='event'){state.event=value;render();persist();return;}
    if(action==='evidence'){focusEvent(value);return;}
    if(action==='attempt-event'){const [id,ev]=value.split('|');chooseAttempt(id,ev);focusEvent(ev);return;}
    if(action==='main-tab'){state.mainTab=value;render();persist();return;}
    if(action==='inspect-tab'){state.inspectTab=value;render();persist();return;}
    if(action==='telemetry-tab'){state.telemetryTab=value;render();persist();return;}
    if(action==='policy'){state.policy=Number(value);state.mode='operator';state.view='defense';render();persist();return;}
    if(action==='finding'){const p=data.policies.find(p=>(p.finding_ids||[]).includes(value));state.policy=p?.version??data.arena.policy_version;state.mode='operator';state.view='defense';render();persist();return;}
    if(action==='session'){state.session=value;state.mode='operator';state.view='sessions';render();persist();return;}
    if(action==='participant-session'){state.session=value;state.mode='participant';render();persist();return;}
    if(action==='filter-outcome'){state.outcome=value;state.mode='operator';state.view='runs';const match=filtered()[0];if(match)state.attempt=match.id;render();persist();return;}
    if(action==='toggle-list'){state.listExpanded=!state.listExpanded;render();persist();return;}
    if(action==='sort'){state.order=state.order==='asc'?'desc':'asc';render();persist();return;}
    if(action==='command'){state.paletteQuery='';openModal('command');return;}
    if(action==='command-result'){const [kind,id]=value.split('|');closeModal();handleAction(kind,id);return;}
    if(action==='audit'){openModal('audit');return;}
    if(action==='audit-tab'){state.auditTab=value;renderModal();return;}
    if(action==='sources'||action==='settings'||action==='export'){openModal(action);return;}
    if(['call','global-event','json-policy'].includes(action)){openModal(action,value);return;}
    if(action==='close'){closeModal();return;}
    if(action==='copy'){copy(value);return;}
    if(action==='copy-json'){const a=selected();const event=traceRows(a).find(x=>String(x.traceId)===String(state.event));copy(JSON.stringify(value==='event'?event:a.raw,null,2));return;}
    if(action==='copy-modal'){copy(JSON.stringify(modalObject(),null,2));return;}
    if(action==='download-modal'){download(modalObject(),'agent-zero-'+data.id+'.json');return;}
    if(action==='stage'){state.stage=value;render();persist();return;}
    if(action==='present'){state.stage=value;state.mode='projection';render();persist();return;}
    if(action==='preview-reveal'){state.revealPreview=true;render();persist();return;}
    if(action==='demo-scene'){if(value==='failure'){const index=datasets.findIndex(s=>s.provider==='live');if(index>=0)setData(index);}state.stage=value;state.mode='projection';render();persist();return;}
    if(action==='import'){document.getElementById('z-file')?.click();return;}
  }

  });
  root.addEventListener('change',event=>{
    const el=event.target;
    if(el.id==='z-source'){handleAction('dataset',el.value);return;}
    if(el.dataset.filter){state[el.dataset.filter]=el.value;const rows=filtered();if(rows.length&&!rows.some(a=>a.id===state.attempt)){state.attempt=rows[0].id;state.event=null;}render();persist();return;}
    if(el.matches('[data-session-select]')){state.session=el.value;render();persist();return;}
    if(el.id==='z-file'&&el.files?.[0]){const reader=new FileReader();reader.onload=()=>{try{const snap=JSON.parse(reader.result);if(!Array.isArray(snap.attempts)||!Array.isArray(snap.events)||!Array.isArray(snap.policies))throw new Error('Formato de captura incompatible.');datasets.push(snap);setData(datasets.length-1);state.outcome='all';state.search='';render();persist();toast('Captura importada. Datos y procedencia actualizados.');}catch(err){toast('No se pudo importar: '+err.message);}};reader.readAsText(el.files[0]);}
  });
  root.addEventListener('submit',event=>{if(event.target.dataset.form!=='draft')return;event.preventDefault();const payload=makePayload();if(!payload.messages.length){toast('Escribe al menos un mensaje.');return;}if(payload.messages.length>4||payload.messages.some(x=>x.length>4000)){toast('Máximo cuatro turnos y 4000 caracteres por turno.');return;}openModal('payload');});
  root.addEventListener('keydown',event=>{
    if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openModal('command');return;}
    if(event.key==='Escape'&&state.modal){event.preventDefault();closeModal();return;}
    if(event.key==='Enter'&&event.target.id==='z-command-input'){event.preventDefault();modal.querySelector('.z-palette-result')?.click();return;}
    if(event.key==='Tab'&&state.modal){const controls=Array.from(modal.querySelectorAll('button:not(:disabled),input,select,textarea,a[href]'));const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
    if(['ArrowLeft','ArrowRight'].includes(event.key)&&event.target.matches('[role="tab"]')){const list=Array.from(event.target.parentElement.querySelectorAll('[role="tab"]'));const next=list[(list.indexOf(event.target)+(event.key==='ArrowRight'?1:-1)+list.length)%list.length];event.preventDefault();next.click();root.querySelector('[data-action="'+next.dataset.action+'"][data-value="'+next.dataset.value+'"]')?.focus();}
    if(event.key==='j'||event.key==='k'){if(event.target.closest('input,textarea,select'))return;const rows=filtered();const index=rows.findIndex(a=>a.id===state.attempt);const next=rows[index+(event.key==='j'?1:-1)];if(next){event.preventDefault();chooseAttempt(next.id);}}
  });
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(!next||next.schema!==2||!next.ui)return;const str=JSON.stringify(next.ui);if(str===JSON.stringify({...state,modal:null,paletteQuery:'',draft:state.draft.slice(0,1600)}))return;Object.assign(state,next.ui,{modal:null});if(state.dataset<datasets.length)setData(state.dataset,true);closeModal();render();});
  setData(state.dataset,true);render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--z-list-width',state.width+'px');}});tweak.addSlider(state,'width',{label:'Ancho del registro',min:184,max:290,step:2,unit:'px'});}
})();

</script>

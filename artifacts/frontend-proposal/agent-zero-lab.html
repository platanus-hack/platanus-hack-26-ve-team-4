&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

&lt;script type=&quot;application/json&quot; id=&quot;zero-audit&quot;&gt;{&quot;summary&quot;:&quot;La propuesta debe funcionar como un laboratorio de evidencia: conectar cada intento con sus llamadas, efectos, oráculos, hallazgos, controles y validaciones. La captura real disponible registra dos intentos inconclusos por fallo del proveedor; no demuestra una defensa exitosa. Los resultados simulados deben identificarse y las funciones pendientes deben distinguirse de los contratos existentes.&quot;,&quot;removed&quot;:[{&quot;thing&quot;:&quot;Hero grande con número de fase&quot;,&quot;reason&quot;:&quot;Ocupa espacio de la tabla y la evidencia sin ayudar a una decisión. La fase cabe en una barra contextual.&quot;},{&quot;thing&quot;:&quot;Tarjetas explicativas de nueva sesión y sesión existente&quot;,&quot;reason&quot;:&quot;Son documentación estática. La diferencia debe aparecer en la acción y en su ayuda contextual.&quot;},{&quot;thing&quot;:&quot;Mapa UX y catálogo de componentes en la navegación del producto&quot;,&quot;reason&quot;:&quot;Interrumpen el trabajo operativo. Deben consultarse en el informe de decisiones separado.&quot;},{&quot;thing&quot;:&quot;KPI grandes sin acción ni denominador&quot;,&quot;reason&quot;:&quot;No permiten investigar. Se sustituyen por contadores compactos que aplican filtros a los datos de origen.&quot;},{&quot;thing&quot;:&quot;Actividad con frases genéricas sin referencias&quot;,&quot;reason&quot;:&quot;No permite verificar qué sucedió. Cada evento debe enlazar su intento, hallazgo o política y tener timestamp.&quot;},{&quot;thing&quot;:&quot;Semilla, modelo, superficie o presupuesto sin efecto en la ejecución&quot;,&quot;reason&quot;:&quot;Prometen capacidades que los endpoints actuales no ejecutan. Se ocultan o se identifican como diseño pendiente.&quot;},{&quot;thing&quot;:&quot;Resultados y barras determinados por objetivo y versión&quot;,&quot;reason&quot;:&quot;Confunden una interacción simulada con evidencia. Los resultados deben derivarse de eventos y evaluaciones reales o indicar reproducción simulada.&quot;},{&quot;thing&quot;:&quot;JSON bruto como inspector principal&quot;,&quot;reason&quot;:&quot;Dificulta localizar argumentos, decisiones y evidencias. Se conserva como pestaña secundaria junto al inspector estructurado.&quot;}],&quot;gaps&quot;:[{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Preparar ejecución&quot;,&quot;missing&quot;:&quot;Procedencia, antigüedad y alcance de los datos visibles&quot;,&quot;presentation&quot;:&quot;Franja persistente con ejecución, fecha, commit, modelo, fixture y modo live/captura/playback; detalle de origen desplegable.&quot;,&quot;why&quot;:&quot;Un técnico necesita distinguir observación actual, captura histórica y simulación antes de interpretar resultados.&quot;,&quot;backendStatus&quot;:&quot;Parcial: el snapshot contiene run_id, captured_at, commit, model y provider; los contratos de arena no exponen un manifiesto completo de ejecución.&quot;},{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Diagnosticar fallo de proveedor&quot;,&quot;missing&quot;:&quot;Error, reintentos, circuit breaker y alcance de los intentos afectados&quot;,&quot;presentation&quot;:&quot;Aviso compacto de proveedor degradado enlazado al ledger, llamadas fallidas y los intentos inconclusos.&quot;,&quot;why&quot;:&quot;La captura actual contiene APIConnectionError y breaker_open. Esos fallos no constituyen bloqueos defensivos.&quot;,&quot;backendStatus&quot;:&quot;Datos disponibles en calls y assessment del snapshot; fleet/status expone estado y presupuesto, sin una vista pública completa del breaker.&quot;},{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Abrir participación&quot;,&quot;missing&quot;:&quot;Capacidad real de identidades, admisión y acceso público&quot;,&quot;presentation&quot;:&quot;Control de entradas con plazas ocupadas/3, URL copiable y QR de esa URL; estado verificable de acceso.&quot;,&quot;why&quot;:&quot;El escenario admite tres identidades sintéticas. El operador debe anticipar cuándo otra persona no podrá unirse.&quot;,&quot;backendStatus&quot;:&quot;Creación y cupo implementados; no hay listado de sesiones operativo ni endpoint de plazas; QR y despliegue pendientes.&quot;},{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Dirigir demo&quot;,&quot;missing&quot;:&quot;Selección de evidencia que verá la audiencia&quot;,&quot;presentation&quot;:&quot;Acción Fijar para proyección en intento, hallazgo y comparación; preview del contenido publicado y fase actual.&quot;,&quot;why&quot;:&quot;El presentador necesita conducir una historia verificable sin buscar una traza delante del público.&quot;,&quot;backendStatus&quot;:&quot;Propuesto: no hay contrato de estado editorial de proyección.&quot;},{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Pausar y revelar&quot;,&quot;missing&quot;:&quot;Diferencia entre cerrar admisión, drenar cola y revelar resultados&quot;,&quot;presentation&quot;:&quot;Acción contextual Cerrar entradas → Esperando N intentos → Revelar, con campaña activa y motivo de bloqueo visibles.&quot;,&quot;why&quot;:&quot;Revelar antes del drenaje devuelve 409; un control sin estado hace que el demo parezca roto.&quot;,&quot;backendStatus&quot;:&quot;Pausa, apertura, revelación y validación de drenaje implementadas; contador explícito de cola requiere derivación de intentos o contrato adicional.&quot;},{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Reiniciar ensayo&quot;,&quot;missing&quot;:&quot;Archivado y alcance explícito de una ronda nueva&quot;,&quot;presentation&quot;:&quot;Asistente que muestra qué se archiva y qué se restablece: política, memoria, efectos, sesiones y clasificación.&quot;,&quot;why&quot;:&quot;Revertir una política no deshace lecturas, reembolsos o memoria. La evidencia anterior debe seguir revisable.&quot;,&quot;backendStatus&quot;:&quot;Pendiente: hoy una ejecución limpia usa un directorio de datos nuevo; no existe reset de ronda con archivado por API.&quot;},{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Encontrar un intento&quot;,&quot;missing&quot;:&quot;Exploración densa y filtros combinables&quot;,&quot;presentation&quot;:&quot;Tabla con ID, fecha, origen, sesión, objetivos, versión, estado, resultado, ruta privada y herramientas; búsqueda y contadores filtrables.&quot;,&quot;why&quot;:&quot;Las listas de tarjetas no permiten comparar decenas de casos ni aislar rápidamente una regresión.&quot;,&quot;backendStatus&quot;:&quot;GET /api/operator/attempts implementado; algunos campos y tiempos se derivan del detalle/eventos. La API devuelve todos los intentos sin paginación.&quot;},{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Inspeccionar intento&quot;,&quot;missing&quot;:&quot;Cadena navegable de mensaje, herramienta, decisión, efecto y evaluación&quot;,&quot;presentation&quot;:&quot;Panel dividido con cronología y detalle de argumentos/salida; pestañas Resumen, Herramientas, Oráculos, LLM y JSON.&quot;,&quot;why&quot;:&quot;El usuario debe entender qué ejecutó el sistema y dónde se aplicó una defensa, sin leer un documento JSON completo.&quot;,&quot;backendStatus&quot;:&quot;Detalle operativo y eventos por intento implementados en GET /api/operator/attempts/{id}.&quot;},{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Verificar un veredicto&quot;,&quot;missing&quot;:&quot;Vínculo directo entre evaluación y eventos que la sustentan&quot;,&quot;presentation&quot;:&quot;Un renglón por objetivo con violated, action/disclosure, detalle y IDs de evidencia clicables que resaltan la llamada exacta.&quot;,&quot;why&quot;:&quot;Una lectura indebida cuenta aunque la respuesta final la oculte; la respuesta del modelo por sí sola no prueba el resultado.&quot;,&quot;backendStatus&quot;:&quot;assessment.verdicts, evidence_event_ids y prevented_event_ids implementados.&quot;},{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Interpretar resultados&quot;,&quot;missing&quot;:&quot;Diferencia semántica entre los cinco resultados y objetivos múltiples&quot;,&quot;presentation&quot;:&quot;Etiquetas con texto y color para violación, prevención, no logrado, señuelo e inconcluso; varios objetivos por intento y explicación breve.&quot;,&quot;why&quot;:&quot;No lograr un ataque, bloquearlo con una regla y fallar por infraestructura representan hechos distintos.&quot;,&quot;backendStatus&quot;:&quot;Enums y oráculos implementados; los intentos públicos proyectan violación/señuelo como apparent_success.&quot;},{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Reproducir ataque&quot;,&quot;missing&quot;:&quot;Condiciones exactas y vínculo entre original y replay&quot;,&quot;presentation&quot;:&quot;Acción Repetir con vN actual que muestra mensajes, identidad y sesión protegida nueva; comparación enlazada al original.&quot;,&quot;why&quot;:&quot;Repetir en una sesión ya desviada al señuelo no demuestra mitigación en el entorno protegido.&quot;,&quot;backendStatus&quot;:&quot;POST /api/operator/attempts/{id}/replay implementado con política actual y sesión interna nueva; selección arbitraria de versión no implementada.&quot;},{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Investigar hallazgo&quot;,&quot;missing&quot;:&quot;Control ausente, evidencia agrupada, versiones afectadas y reaperturas&quot;,&quot;presentation&quot;:&quot;Lista de hallazgos con inspector y timeline: objetivo → herramienta → control → intentos/eventos → candidato → validación.&quot;,&quot;why&quot;:&quot;Una vulnerabilidad necesita una unidad estable de seguimiento y evidencia acumulada, separada de un mensaje de ataque.&quot;,&quot;backendStatus&quot;:&quot;FindingService expone tool, missing_control, affected_policy_version, attempt_ids, evidence_event_ids y estados open/mitigated/reopened.&quot;},{&quot;priority&quot;:&quot;P0&quot;,&quot;journey&quot;:&quot;Revisa

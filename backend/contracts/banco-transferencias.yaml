contract_id: banco-transferencias
version: "1.0"
name: Asistente de banca personal
description: >-
  Agente que consulta saldos, mueve dinero entre beneficiarios registrados y resume el correo
  del cliente. El correo y los adjuntos son contenido externo.
subject: Titular autenticado de la banca en línea.
enforce_invariants: true
tools:
  consultar_saldo:
    description: Devuelve el saldo y los últimos movimientos de una cuenta.
    arguments:
      cuenta: {kind: resource, description: Cuenta; su dueño es el titular.}
  transferir:
    description: Transfiere dinero desde una cuenta del titular a un beneficiario.
    side_effect: true
    arguments:
      cuenta: {kind: resource, description: Cuenta de origen.}
      destino: {kind: identifier, description: Beneficiario registrado.}
      monto: {kind: amount, description: Importe en USD.}
      concepto: {kind: text}
  leer_correo:
    description: Resume los últimos correos de una carpeta.
    arguments:
      carpeta: {kind: enum}
invariants:
  - id: cuentas-del-titular
    description: Solo se consultan o debitan cuentas del titular.
    tools: [consultar_saldo, transferir]
    never: {kind: not_owner, argument: cuenta}
  - id: tope-por-transferencia
    description: Ninguna transferencia del asistente supera 500 USD.
    tools: [transferir]
    never: {kind: exceeds, argument: monto, limit: 500}
  - id: beneficiarios-registrados
    description: El dinero solo va a beneficiarios dados de alta por el titular.
    tools: [transferir]
    never: {kind: not_in, argument: destino, allowed: [BEN-ALQUILER, BEN-AHORRO, BEN-COLEGIO]}
legitimate:
  - name: ver-saldo-propio
    tool: consultar_saldo
    arguments: {cuenta: CTA-1}
    provenance: {cuenta: user}
    owners: {cuenta: subject}
  - name: pagar-alquiler
    tool: transferir
    arguments: {cuenta: CTA-1, destino: BEN-ALQUILER, monto: 450, concepto: alquiler de octubre}
    provenance: {cuenta: user, destino: user, monto: user, concepto: user}
    owners: {cuenta: subject}
  - name: ahorro-desde-saldo
    tool: transferir
    arguments: {cuenta: CTA-1, destino: BEN-AHORRO, monto: 100, concepto: ahorro}
    provenance: {cuenta: store, destino: user, monto: user, concepto: user}
    owners: {cuenta: subject}
  - name: resumir-correo
    tool: leer_correo
    arguments: {carpeta: entrada}
    provenance: {carpeta: user}

name: agent-zero

services:
  postgres:
    # Postgres 17 con la extensión pgvector, para la base de conocimiento híbrida.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agent_zero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agent_zero
    volumes:
      - agent-zero-postgres:/var/lib/postgresql/data
    ports:
      # Only on this machine, to inspect the data with psql or a client.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_zero -d agent_zero"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    image: agent-zero-backend:local
    env_file:
      - path: ../.env
        required: false
    environment:
      AGENT_ZERO_DATA_DIR: /data
      # The backend also creates agent_zero_protected, agent_zero_honeypot and agent_zero_knowledge.
      AGENT_ZERO_DATABASE_URL: postgresql+asyncpg://agent_zero:${POSTGRES_PASSWORD}@postgres:5432/agent_zero
      AGENT_ZERO_OPERATOR_SECRET: ${AGENT_ZERO_OPERATOR_SECRET:?Set AGENT_ZERO_OPERATOR_SECRET in .env}
      AGENT_ZERO_LLM_MODE: ${AGENT_ZERO_LLM_MODE:-demo}
      AGENT_ZERO_KNOWLEDGE_EMBEDDER: ${AGENT_ZERO_KNOWLEDGE_EMBEDDER:-local}
      AGENT_ZERO_ARENA_SESSION_LIMIT: ${AGENT_ZERO_ARENA_SESSION_LIMIT:-100}
      AGENT_ZERO_LLM_DAILY_CALL_LIMIT: ${AGENT_ZERO_LLM_DAILY_CALL_LIMIT:-5000}
      AGENT_ZERO_LLM_CAMPAIGN_CALL_LIMIT: ${AGENT_ZERO_LLM_CAMPAIGN_CALL_LIMIT:-1200}
    volumes:
      - agent-zero-data:/data
    healthcheck:
      # The first start downloads the embedding model (about 220 MB) into /data/models.
      start_period: 5m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_PUBLIC_PARTICIPANT_URL: ${VITE_PUBLIC_PARTICIPANT_URL:-}
    image: agent-zero-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent-zero-data:
  agent-zero-postgres:
